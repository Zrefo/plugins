name: Guilds
version: '1.0.0'
main: com.eme.guilds.GuildsPlugin
api-version: '1.20'
author: EME
description: System gildii z mostkiem czatu do Discorda.
softdepend: [PlayerStats]

commands:
  guild:
    description: Zarządzanie gildią
    usage: /guild <create|invite|chat> [argumenty]
    aliases: [g]
  gc:
    description: Wyślij wiadomość na czat gildii
    usage: /gc <wiadomość>
